name = "mynote-worker"
main = "worker.js"
compatibility_date = "2024-09-01"
account_id = "c3d95c783bd334edd94c13fb99b5f413"

# ============================================================
# ⚙️ متغیرهای محیطی (Plaintext)
# ============================================================
[vars]
# شناسه‌های کانال
SOURCE_CHANNEL_ID = "4743880175"
DEST_CHANNEL_ID = "5235764517"
DEST_CHANNEL_USERNAME = "yadbegirim"
ADMIN_ID = "1381797564"

# کلید ادمین برای endpoint های /admin/*
ADMIN_KEY = "In58#935MinT"

# تنظیمات عملکرد
SEND_WINDOW = "on"
CLEAN_CAPTIONS = "on"
DELETE_SOURCE = "on"
MIN_DELAY_SEC = "60"
MAX_DELAY_SEC = "180"
WINDOW_START_MIN = "510"
WINDOW_END_MIN = "1350"
ALBUM_QUIET_SEC = "20"
ALBUM_TTL_SEC = "900"
REPORT_INTERVAL_SEC = "3600"
LOCK_TTL_SEC = "120"
SEEN_TTL_SEC = "604800"
DLQ_TTL_SEC = "2592000"
MAX_RETRIES = "5"
HASH_HISTORY = "2000"
LIST_LIMIT = "50"

# ============================================================
# 🔐 اتصال KV
# ============================================================
[[kv_namespaces]]
binding = "MYNOTE_KV"
id = "c0e487e2c5da4e46a61ce8dd2965ea96"

# ============================================================
# ⏰ Cron Triggers (هر 3 دقیقه بیدار شو)
# ============================================================
[triggers]
crons = ["*/3 * * * *"]

# ============================================================
# 📊 Observability (فقط لاگ — بخش traces حذف شد)
# ============================================================
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true